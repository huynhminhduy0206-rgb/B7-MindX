<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            font-family: Comfortaa, cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 36px;
            margin: 40px 0;
            text-align: center;
        }

        .search-container {
            margin-bottom: 40px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #pokemonInput {
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #FFD700;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-family: Comfortaa, cursive;
            width: 300px;
            text-align: center;
            transition: all 0.3s ease;
        }

        #pokemonInput:focus {
            outline: none;
            border-color: #FFA500;
            background-color: #444;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        #searchBtn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #FFD700;
            color: black;
            border: none;
            border-radius: 8px;
            font-family: Comfortaa, cursive;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #searchBtn:hover {
            background-color: #FFA500;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.7);
        }

        #searchBtn:active {
            transform: scale(0.95);
        }

        #results {
            width: 100%;
            max-width: 400px;
            color: white;
        }

        .pokemon-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #FFD700;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3), 0 0 20px rgba(255, 165, 0, 0.2);
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pokemon-card h2 {
            color: #FFD700;
            margin: 15px 0;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .pokemon-card img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            margin: 20px 0;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
            transition: transform 0.3s ease;
        }

        .pokemon-card img:hover {
            transform: scale(1.1);
        }

        .pokemon-info {
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
        }

        .pokemon-card p {
            margin: 12px 0;
            font-size: 17px;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .pokemon-card strong {
            color: #FFA500;
        }

        .pokemon-stats {
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #FFA500;
        }

        .pokemon-stats h3 {
            color: #FFD700;
            font-size: 22px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .stat-label {
            width: 140px;
            font-weight: bold;
            color: #FFA500;
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
        }

        .stat-bar-container {
            flex: 1;
            background-color: rgba(255, 215, 0, 0.1);
            border-radius: 8px;
            height: 25px;
            overflow: hidden;
            border: 1px solid #FFD700;
            position: relative;
        }

        .stat-bar {
            height: 100%;
            background: linear-gradient(90deg, #FFA500, #FFD700);
            border-radius: 8px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .stat-value {
            color: black;
            font-weight: bold;
            font-size: 13px;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
        }
    </style>

</head>
<body>
    <h1>Pokemon Search</h1>
    
    <div class="search-container">
        <input 
            type="text" 
            id="pokemonInput" 
            placeholder="Enter Pokemon name..."
        >
        <button id="searchBtn">Search</button>
    </div>

    <div id="results"></div>
    
    <script src="main.js"></script>
</body>
</html>
